[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "odprti-racuni-obcine"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.2",
    "psycopg2-binary==2.9.13",
    "boto3==1.43.125",
    "django-storages==1.14.6",
    "gunicorn==26.2.0",
    "Pillow==13.0.0",
    "sentry-sdk==2.74.0",
    "django-mptt==0.21.1",
    "martor==1.8.5",
    "python-dateutil==2.9.0.post0",
    "babel==2.18.0",
    "htmldocx==0.0.6",
    "requests==2.34.2",
    "django-js-asset==5.0.0",
    "django-jsonify==0.3.0",
    "Markdown==3.11.2",
    "openpyxl==3.1.5",
    "pdfplumber==0.11.10",
    "xlrd==2.0.2"
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "django-stubs==6.1.2",
    "django-stubs-ext==6.1.2",
    "ipython==9.18.1",
    "isort",
]

[tool.setuptools.packages.find]
include = ["obcine*", "odprti_racuni_obcine*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
